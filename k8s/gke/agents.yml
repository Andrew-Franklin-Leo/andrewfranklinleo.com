apiVersion: apps/v1
kind: Deployment
metadata:
  name: aineff-agent-runtime
  labels:
    app: aineff-agent-runtime
    tier: agents
    ecosystem: aineff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aineff-agent-runtime
  template:
    metadata:
      labels:
        app: aineff-agent-runtime
        tier: agents
        ecosystem: aineff
    spec:
      containers:
        - name: agent-runtime
          image: us-central1-docker.pkg.dev/andrewfranklinleo-site/andrewfranklinleo/agent-runtime:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: agent-env
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: aineff-agent-runtime
  labels:
    app: aineff-agent-runtime
spec:
  selector:
    app: aineff-agent-runtime
  ports:
    - port: 80
      targetPort: 8080
      name: http
  type: ClusterIP
---
# Auto-Research Scanner CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: auto-research-scanner
  labels:
    app: auto-research-scanner
    tier: agents
    ecosystem: aineff
spec:
  schedule: "0 9 * * 1"  # Every Monday at 9am UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: auto-research-scanner
        spec:
          restartPolicy: Never
          containers:
            - name: scanner
              image: us-central1-docker.pkg.dev/andrewfranklinleo-site/andrewfranklinleo/platform:latest
              command: ["npx", "tsx", "scripts/scan-github-trends.ts"]
              envFrom:
                - secretRef:
                    name: agent-env
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
---
