apiVersion: apps/v1
kind: Deployment
metadata:
  name: andrewfranklinleo
  labels:
    app: andrewfranklinleo
    tier: platform
    ecosystem: aineff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: andrewfranklinleo
  template:
    metadata:
      labels:
        app: andrewfranklinleo
        tier: platform
        ecosystem: aineff
    spec:
      containers:
        - name: web
          image: us-central1-docker.pkg.dev/andrewfranklinleo-site/andrewfranklinleo/platform:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: platform-env
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: andrewfranklinleo
  labels:
    app: andrewfranklinleo
spec:
  selector:
    app: andrewfranklinleo
  ports:
    - port: 80
      targetPort: 3000
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: andrewfranklinleo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: andrewfranklinleo
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
