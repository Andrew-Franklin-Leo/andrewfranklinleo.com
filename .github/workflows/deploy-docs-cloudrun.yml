name: Deploy Docs to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
  workflow_dispatch:

env:
  PROJECT_ID: andrewfranklinleo-site
  REGION: us-central1
  SERVICE: andrewfranklinleo-docs
  IMAGE: us-central1-docker.pkg.dev/andrewfranklinleo-site/andrewfranklinleo/docs

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Create Artifact Registry repo (if not exists)
        continue-on-error: true
        run: |
          gcloud artifacts repositories describe andrewfranklinleo \
            --location=${{ env.REGION }} 2>/dev/null || \
          gcloud artifacts repositories create andrewfranklinleo \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="AINEFF ecosystem containers"

      - name: Build and push docs image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} \
                       -t ${{ env.IMAGE }}:latest \
                       docs-site/
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --port=8080 \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=10 \
            --memory=256Mi \
            --cpu=1 \
            --concurrency=80 \
            --set-env-vars="NODE_ENV=production"

      - name: Show deployment URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "Docs deployed to: $URL"
          echo "## Docs Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: $URL" >> $GITHUB_STEP_SUMMARY
