name: Deploy Platform to GKE Autopilot

on:
  push:
    branches:
      - main       # -> production namespace
      - develop    # -> staging namespace
    paths-ignore:
      - 'docs-site/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: andrewfranklinleo-site
  REGION: us-central1
  CLUSTER: aineff-autopilot
  IMAGE: us-central1-docker.pkg.dev/andrewfranklinleo-site/andrewfranklinleo/platform

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Create Artifact Registry repo (if not exists)
        continue-on-error: true
        run: |
          gcloud artifacts repositories describe andrewfranklinleo \
            --location=${{ env.REGION }} 2>/dev/null || \
          gcloud artifacts repositories create andrewfranklinleo \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="AINEFF ecosystem containers"

      - id: meta
        name: Set image tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push platform image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }} \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: Create namespace (if not exists)
        run: kubectl create namespace aineff-staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to staging
        run: |
          kubectl apply -f k8s/gke/base.yml -n aineff-staging
          kubectl set image deployment/andrewfranklinleo \
            web=${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }} \
            -n aineff-staging
          kubectl rollout status deployment/andrewfranklinleo \
            -n aineff-staging --timeout=300s

      - name: Show staging status
        run: |
          kubectl get pods -n aineff-staging
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: Create namespace (if not exists)
        run: kubectl create namespace aineff-production --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to production
        run: |
          kubectl apply -f k8s/gke/production.yml -n aineff-production
          kubectl set image deployment/andrewfranklinleo \
            web=${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }} \
            -n aineff-production
          kubectl rollout status deployment/andrewfranklinleo \
            -n aineff-production --timeout=300s

      - name: Show production status
        run: |
          kubectl get pods -n aineff-production
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
