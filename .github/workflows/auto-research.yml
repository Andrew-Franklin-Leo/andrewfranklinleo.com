name: Organism Evolution — Daily Research + Mutation Cycle

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6am UTC
  workflow_dispatch:

jobs:
  scan-github-trends:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scan GitHub trends and monitored repos
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/scan-github-trends.ts > /tmp/research-report.md

      - name: Create research issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          gh issue create \
            --title "Evolution Digest: $DATE" \
            --body-file /tmp/research-report.md \
            --label "auto-research" \
            --label "evolution"

  scan-arxiv:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Scan arXiv for relevant papers
        id: arxiv
        run: |
          QUERIES=(
            "multi-agent+systems+autonomous"
            "self-healing+AI+systems"
            "agentic+AI+governance"
            "closed+loop+feedback+LLM"
            "swarm+intelligence+large+language+models"
            "autonomous+enterprise+AI"
            "evolutionary+algorithm+neural+architecture"
          )

          echo "# arXiv Research Scan — $(date +%Y-%m-%d)" > /tmp/arxiv-report.md
          echo "" >> /tmp/arxiv-report.md

          for QUERY in "${QUERIES[@]}"; do
            echo "## Query: ${QUERY//+/ }" >> /tmp/arxiv-report.md
            echo "" >> /tmp/arxiv-report.md

            curl -s "http://export.arxiv.org/api/query?search_query=all:${QUERY}&start=0&max_results=5&sortBy=submittedDate&sortOrder=descending" \
              | grep -oP '(?<=<title>).*?(?=</title>)' \
              | head -5 \
              | while read -r title; do
                echo "- $title" >> /tmp/arxiv-report.md
              done

            echo "" >> /tmp/arxiv-report.md
          done

      - name: Append arXiv findings to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          ISSUE_NUM=$(gh issue list --label "auto-research" --search "$DATE" --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -n "$ISSUE_NUM" ]; then
            gh issue comment "$ISSUE_NUM" --body-file /tmp/arxiv-report.md
          fi

  evolve:
    runs-on: ubuntu-latest
    needs: [scan-github-trends, scan-arxiv]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Trigger evolution cycle
        env:
          EVOLUTION_API: ${{ secrets.NEXT_PUBLIC_BASE_URL || 'https://aineff-platform.web.app' }}
        run: |
          echo "Triggering daily evolution cycle..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${EVOLUTION_API}/api/evolution/cycles" \
            -H "Content-Type: application/json" \
            -d '{"trigger":"scheduled","config":{"mutationsPerCycle":5}}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Evolution cycle triggered successfully"
          else
            echo "Evolution cycle trigger failed (non-fatal)"
          fi
