services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    command: npm run dev
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CMS_PORT: 4000
      CMS_ADMIN_TOKEN: ${CMS_ADMIN_TOKEN}
      CMS_CONTENT_DIR: /app/content
    command: npm run cms

volumes:
  node_modules:
  next_cache:
